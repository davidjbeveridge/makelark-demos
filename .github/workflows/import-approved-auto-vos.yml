name: Import approved Auto Vos files

on:
  push:
    branches: [main]
    paths: [.github/workflows/import-approved-auto-vos.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - name: Download and verify all approved files
        run: |
          python3 - <<'PY'
          import hashlib, io, json, pathlib, urllib.request, zipfile
          url = 'https://sdmntprwestus.oaiusercontent.com/files/00000000-fa2c-8230-bb9c-2ea4a4537dd1/raw?se=2026-10-06T03%3A27%3A59Z&sp=r&sv=2026-02-06&sr=b&scid=ddba5b9e-7c96-546d-9cc6-6de8fdba65b6&skoid=c69179d1-5b5d-430f-afa3-b9bdcf9d6497&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-06T02%3A01%3A52Z&ske=2026-10-07T02%3A01%3A52Z&sks=b&skv=2026-02-06&sig=gETL2vI34GjzYmZgmyKZN7Bn2rdGDrHCsrbL%2BgjfLsg%3D'
          print('::add-mask::' + url)
          request = urllib.request.Request(url, headers={'User-Agent': 'AutoVos-Approved-Deployment/1.0'})
          try:
              with urllib.request.urlopen(request, timeout=90) as response:
                  data = response.read(7_000_001)
          except urllib.error.HTTPError as exc:
              print('Transfer failed:', exc.code)
              print(exc.read(4000).decode('utf-8', 'replace'))
              raise SystemExit(1)
          if hashlib.sha256(data).hexdigest() != '0ed9d94315edb8ac1975dd1a7a4271a8ec7c0f7a7d5f60562457404da4290e81':
              raise SystemExit('Bundle checksum mismatch; no changes made.')
          manifest = json.loads(pathlib.Path('.github/auto-vos-deployment-manifest.json').read_text())
          with zipfile.ZipFile(io.BytesIO(data)) as archive:
              if set(archive.namelist()) != set(manifest) or len(archive.infolist()) != len(manifest):
                  raise SystemExit('Unexpected bundle contents; no changes made.')
              approved = {}
              for name, expected in manifest.items():
                  path = pathlib.Path(name)
                  if path.is_absolute() or '..' in path.parts or path.parts[0] != 'auto-vos':
                      raise SystemExit('Unsafe path; no changes made.')
                  content = archive.read(name)
                  if len(content) != expected['bytes'] or hashlib.sha256(content).hexdigest() != expected['sha256']:
                      raise SystemExit('Asset checksum mismatch: ' + name)
                  if path.exists() and path.read_bytes() != content:
                      raise SystemExit('Refusing to overwrite changed file: ' + name)
                  approved[path] = content
              for path, content in approved.items():
                  path.parent.mkdir(parents=True, exist_ok=True)
                  path.write_bytes(content)
                  print('VERIFIED', path, len(content))
          print('Imported all 15 approved files without modifying their bytes.')
          PY
      - name: Commit approved site and media
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- auto-vos
          if ! git diff --cached --quiet; then
            git commit -m 'Publish approved Auto Vos homepage, original SVG logo and complete video assets'
            git push origin HEAD:main
          fi
