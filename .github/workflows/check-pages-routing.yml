name: Check Pages routing (temporary)
on:
  push:
    branches: [main]
    paths: [.github/workflows/check-pages-routing.yml]
  workflow_dispatch:
permissions:
  contents: read
  pages: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect effective Pages settings and public responses
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import concurrent.futures, datetime, hashlib, json, os, re, urllib.error, urllib.request
          print('CHECK_TIME', datetime.datetime.now(datetime.timezone.utc).isoformat())
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args):
                  return None
          opener = urllib.request.build_opener(NoRedirect)
          def check(url, api=False):
              headers = {'User-Agent': 'MakeLark-Pages-Check', 'Cache-Control': 'no-cache'}
              if api:
                  headers.update({'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
              try:
                  request = urllib.request.Request(url, headers=headers)
                  try:
                      response = opener.open(request, timeout=20)
                  except urllib.error.HTTPError as exc:
                      response = exc
                  with response:
                      data = response.read(200000)
                      result = {'url': url, 'status': response.code, 'location': response.headers.get('Location'), 'content_type': response.headers.get('Content-Type'), 'server': response.headers.get('Server')}
                  text = data.decode('utf-8', 'replace')
                  if api:
                      obj = json.loads(text)
                      result['pages'] = {key: obj.get(key) for key in ('status', 'cname', 'html_url', 'build_type', 'source', 'https_enforced', 'public', 'message')}
                  else:
                      result['sha256'] = hashlib.sha256(data).hexdigest()
                      title = re.search(r'<title[^>]*>(.*?)</title>', text, re.I | re.S)
                      result['title'] = title.group(1).strip() if title else None
                      result['auto_vos_present'] = 'Auto Vos' in text
                  print(json.dumps(result))
              except Exception as exc:
                  print(json.dumps({'url': url, 'error': str(exc)}))
          check('https://api.github.com/repos/davidjbeveridge/makelark-demos/pages', True)
          urls = [
              'https://davidjbeveridge.github.io/',
              'https://davidjbeveridge.github.io/makelark-demos/',
              'https://davidjbeveridge.github.io/makelark-demos/auto-vos/',
              'https://davidjbeveridge.github.io/makelark-demos/auto-vos/index.html',
              'https://davidjbeveridge.github.io/makelark-demos/auto-vos/styles.css',
              'https://davidjbeveridge.github.io/makelark-demos/auto-vos/assets/auto-vos-logo.svg',
              'http://davidbeveridge.net/makelark-demos/auto-vos/'
          ]
          with concurrent.futures.ThreadPoolExecutor(max_workers=7) as pool:
              list(pool.map(check, urls))
          PY
