name: Deploy demos to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - '**/*.html'
      - '**/*.css'
      - '**/*.js'
      - '**/assets/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the approved source
        uses: actions/checkout@v4
      - name: Validate assets and stage only static demo directories
        run: |
          python3 - <<'PY'
          import html, pathlib, shutil, urllib.parse
          root = pathlib.Path('.')
          required = (
              'index.html', 'styles.css', 'app.js',
              'assets/auto-vos-logo.svg', 'assets/auto-vos-logo-black.svg',
              'assets/favicon.svg', 'assets/hero-poster.webp',
              'assets/audi-glass.webp', 'assets/ceramic-application.webp',
              'assets/porsche-silver.webp', 'assets/porsche-yellow.webp',
              'assets/ppf-installation.webp', 'assets/precision-install.webp',
              'assets/shop-film.mp4', 'assets/shop-film-mobile.mp4',
          )
          for name in required:
              path = root / 'auto-vos' / name
              if not path.is_file() or path.stat().st_size == 0:
                  raise SystemExit('Approved Auto Vos asset not uploaded yet: ' + str(path))
          output = root / '_site'
          output.mkdir(exist_ok=True)
          demos = []
          for source in sorted(root.iterdir()):
              if source.name.startswith('.') or source.name == '_site':
                  continue
              if not source.is_dir() or not (source / 'index.html').is_file():
                  continue
              if source.is_symlink() or any(p.is_symlink() for p in source.rglob('*')):
                  raise SystemExit('Refusing to publish a symlink: ' + str(source))
              shutil.copytree(source, output / source.name, dirs_exist_ok=True)
              demos.append(source.name)
          (output / '.nojekyll').touch()
          links = ''.join('<li><a href="' + urllib.parse.quote(name, safe='') + '/">' + html.escape(name) + '</a></li>' for name in demos)
          (output / 'index.html').write_text('<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>MakeLark demos</title><h1>MakeLark demos</h1><ul>' + links + '</ul></html>', encoding='utf-8')
          print('Staged demo directories: ' + ', '.join(demos))
          PY
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
