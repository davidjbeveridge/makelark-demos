name: Deploy demos to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - '**/*.html'
      - '**/*.css'
      - '**/*.js'
      - '**/assets/**'
      - '.github/auto-vos-deployment-manifest.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out approved source
        uses: actions/checkout@v5
      - name: Verify all approved bytes and stage static demos
        run: |
          python3 - <<'PY'
          import hashlib, html, json, pathlib, shutil, urllib.parse
          root = pathlib.Path('.')
          manifest = json.loads((root / '.github/auto-vos-deployment-manifest.json').read_text())
          for name, expected in manifest.items():
              path = root / name
              if not path.is_file() or path.is_symlink():
                  raise SystemExit('Missing or unsafe asset: ' + name)
              data = path.read_bytes()
              if len(data) != expected['bytes'] or hashlib.sha256(data).hexdigest() != expected['sha256']:
                  raise SystemExit('Approved asset checksum mismatch: ' + name)
              print('VERIFIED', name, len(data))
          output = root / '_site'
          output.mkdir(exist_ok=True)
          demos = []
          for source in sorted(root.iterdir()):
              if source.name.startswith('.') or source.name == '_site':
                  continue
              if not source.is_dir() or not (source / 'index.html').is_file():
                  continue
              if source.is_symlink() or any(p.is_symlink() for p in source.rglob('*')):
                  raise SystemExit('Refusing to publish a symlink: ' + str(source))
              shutil.copytree(source, output / source.name, dirs_exist_ok=True)
              demos.append(source.name)
          (output / '.nojekyll').touch()
          links = ''.join('<li><a href="' + urllib.parse.quote(name, safe='') + '/">' + html.escape(name) + '</a></li>' for name in demos)
          (output / 'index.html').write_text('<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>MakeLark demos</title><h1>MakeLark demos</h1><ul>' + links + '</ul></html>', encoding='utf-8')
          (output / 'robots.txt').write_text('User-agent: *\nDisallow: /\n', encoding='utf-8')
          print('Staged: ' + ', '.join(demos))
          PY
      - name: Upload verified Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          retention-days: 7
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Deploy verified artifact
        id: deployment
        uses: actions/deploy-pages@v4
