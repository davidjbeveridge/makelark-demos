name: Import approved Auto Vos demo

on:
  push:
    branches: [main]
    paths: [.github/workflows/import-auto-vos.yml]

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Import checksum-verified approved site
        env:
          BUNDLE_URL: 'https://sdmntprwestus.oaiusercontent.com/files/00000000-0b60-8230-b728-0305423d1fc1/raw?se=2026-10-05T23%3A56%3A07Z&sp=r&sv=2026-02-06&sr=b&scid=259101c1-3e3f-5490-bfea-4e89737d2fcb&skoid=c69179d1-5b5d-430f-afa3-b9bdcf9d6497&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-05T16%3A51%3A41Z&ske=2026-10-06T16%3A51%3A41Z&sks=b&skv=2026-02-06&sig=Oiz6dnUs9nucE3Ng//Aw1uKfcFfKGkfEUT2jAxRBjwY%3D'
        run: |
          python3 - <<'PY'
          import hashlib, io, os, pathlib, urllib.request, zipfile
          url = os.environ['BUNDLE_URL']
          print('::add-mask::' + url)
          with urllib.request.urlopen(url, timeout=90) as response:
              data = response.read(8_000_001)
          expected = 'f81ee41d7f39c691bbead5bbaedddfeb73f676be169f7cf7d3aae2cdf00db838'
          if hashlib.sha256(data).hexdigest() != expected:
              raise SystemExit('Bundle checksum mismatch; no files written.')
          allowed = {
              'auto-vos/index.html', 'auto-vos/styles.css', 'auto-vos/app.js',
              'auto-vos/assets/audi-glass.webp',
              'auto-vos/assets/auto-vos-logo-black.svg',
              'auto-vos/assets/auto-vos-logo.svg',
              'auto-vos/assets/ceramic-application.webp',
              'auto-vos/assets/favicon.svg',
              'auto-vos/assets/hero-poster.webp',
              'auto-vos/assets/porsche-silver.webp',
              'auto-vos/assets/porsche-yellow.webp',
              'auto-vos/assets/ppf-installation.webp',
              'auto-vos/assets/precision-install.webp',
              'auto-vos/assets/shop-film-mobile.mp4',
              'auto-vos/assets/shop-film.mp4',
          }
          with zipfile.ZipFile(io.BytesIO(data)) as archive:
              if set(archive.namelist()) != allowed or len(archive.infolist()) != len(allowed):
                  raise SystemExit('Unexpected bundle contents; no files written.')
              for name in sorted(allowed):
                  path = pathlib.Path(name)
                  content = archive.read(name)
                  if path.exists() and path.read_bytes() != content:
                      raise SystemExit(f'Refusing to overwrite an existing changed file: {name}')
              for name in sorted(allowed):
                  path = pathlib.Path(name)
                  content = archive.read(name)
                  path.parent.mkdir(parents=True, exist_ok=True)
                  path.write_bytes(content)
                  print(f'{hashlib.sha256(content).hexdigest()}  {name}')
          print('Imported all 15 approved static files without changes.')
          PY
      - name: Commit imported assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- auto-vos
          if ! git diff --cached --quiet; then
            git commit -m 'Add approved Auto Vos homepage, original traced logo and video assets'
            git push origin HEAD:main
          fi
